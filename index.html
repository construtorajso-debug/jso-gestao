<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c51f1f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="JSO Gestão"><meta name="description" content="Gestão de obras e orçamentos da Construtora JSO"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="stylesheet" href="style.css?v=36"><title>JSO Gestão</title></head><body>
<header><div class="brand"><b>JSO</b><span>CONSTRUÇÕES E REFORMAS</span><small>A Construtora do Povo</small></div><button id="menuBtn">☰</button></header>
<div class="layout"><nav id="nav"></nav><main><div id="view"></div></main></div>
<script src="pdf-lib.min.js"></script><script src="quote_catalog.js"></script><script src="clients.js"></script><script src="app.js?v=34"></script><script src="diary.js"></script><script src="report.js"></script><script src="materials.js?v=27"></script>
<script>
(function(){
 const panel=document.createElement('section');
 panel.id='receipt-alerts';panel.className='panel';panel.setAttribute('aria-live','polite');
 document.querySelector('#view').before(panel);
 function renderReceiptAlerts(){
  const works=[...new Set(db.obras.map(o=>o['Cliente/Obra']).filter(Boolean))];
  const reached=works.map(name=>{const c=calc(name);const percent=c.contratos>0?c.rec/c.contratos*100:0;return {name,c,percent,level:percent>=75?75:percent>=50?50:0}}).filter(w=>w.level);
  panel.innerHTML='<h2>Alertas de recebimento por obra</h2>'+ (reached.length?'<div class="cards">'+reached.map(w=>'<div class="card" style="border-left:5px solid '+(w.level===75?'#c51f1f':'#d69900')+'"><strong>'+esc(w.name)+'</strong><p><b>'+w.level+'% do valor da obra recebido</b></p><p>Recebido: '+money(w.c.rec)+' de '+money(w.c.contratos)+' ('+w.percent.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%).</p><small>'+ (w.level===75?'Marcos de 50% e 75% atingidos.':'Metade recebida. Próximo alerta: 75%.')+'</small></div>').join('')+'</div>':'<p class="muted">Os alertas aparecem aqui quando os recebimentos de cada obra atingirem 50% e 75% do contrato com os extras aprovados.</p>');
 }
 new MutationObserver(renderReceiptAlerts).observe(document.querySelector('#view'),{childList:true,subtree:true});
 window.addEventListener('pageshow',renderReceiptAlerts);
 renderReceiptAlerts();
})();
</script>
</body></html>
