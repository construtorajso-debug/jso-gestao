<script>
(function(){
 const oldDashboard=dashboard;let chartWork=null;
 function chart(c,title){
  const values=[['Contrato e extras aprovados',c.contratos,'#3273c8'],['Recebido do cliente',c.rec,'#238d68'],['Gastos da obra',c.gastos,'#c51f1f'],['Saldo a receber',c.saldo,'#ce8a12']];
  const lo=Math.min(0,...values.map(v=>v[1])),hi=Math.max(0,...values.map(v=>v[1])),range=hi-lo||1,zero=-lo/range*100;
  return '<div class="jso-chart" role="img" aria-label="'+esc(title+': '+values.map(v=>v[0]+' '+money(v[1])).join('; '))+'">'+values.map(v=>'<div><div class="jso-chart-label"><b>'+v[0]+'</b><span>'+money(v[1])+'</span></div><div class="jso-chart-track"><span class="jso-chart-zero" style="left:'+zero+'%"></span><span class="jso-chart-bar" style="left:'+((Math.min(0,v[1])-lo)/range*100)+'%;width:'+(Math.abs(v[1])/range*100)+'%;background:'+v[2]+'"></span></div></div>').join('')+'<div class="jso-chart-axis"><span>'+money(lo)+'</span><span>'+money(hi)+'</span></div></div>';
 }
 dashboard=function(k){
  if(k!=='graficos')return oldDashboard(k);

  const works=[...new Set(db.obras.map(o=>o['Cliente/Obra']).filter(Boolean))];if(chartWork!==null&&!works.includes(chartWork))chartWork=null;
  const selected=chartWork===null?calc():calc(chartWork);
  function balloon(name,total,active){return '<button type="button" class="card card-link" data-chart-work="'+(name===null?'total':esc(name))+'" aria-pressed="'+active+'" style="border:2px solid '+(active?'#c51f1f':'#e3e6eb')+';text-align:left"><small>'+esc(name===null?'Total de todas as obras':name)+'</small><strong>'+money(total)+'</strong><span style="font-size:14px">Ver gráfico</span></button>'}
  document.querySelector('#view').innerHTML='<div class="title"><h1>Painel Gráficos</h1></div><div class="cards">'+balloon(null,calc().contratos,chartWork===null)+works.map(name=>balloon(name,calc(name).contratos,chartWork===name)).join('')+'</div><section class="panel" style="margin-top:20px"><h2>'+esc(chartWork===null?'Gráfico geral — todas as obras':'Gráfico da obra: '+chartWork)+'</h2>'+chart(selected,chartWork===null?'Gráfico geral':'Gráfico de '+chartWork)+'<p class="jso-chart-note">Os balões mostram o valor do contrato com extras aprovados. As barras mostram contrato, recebido, gastos e saldo a receber.</p></section>';
 };
 document.addEventListener('click',event=>{const button=event.target.closest('[data-chart-work]');if(button){chartWork=button.dataset.chartWork==='total'?null:button.dataset.chartWork;dashboard('graficos')}});

})();
</script>

<style>.progress-tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.progress-row{padding:18px 0;border-bottom:1px solid #e3e6eb}.progress-row:last-child{border:0}.progress-row .actions{margin-top:12px}.progress-history{margin-top:14px}.progress-history li{margin:10px 0}.progress-preview{padding:12px;background:#eef5ff;border-radius:8px;font-size:16px}</style>
<script>
function progressRatio(service){const done=(service.logs||[]).reduce((sum,l)=>sum+num(l.quantity),0);return service.total>0?Math.min(100,done/service.total*100):0}
function progressQuantity(note,unit,remaining){
 const text=String(note||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/m2/g,'m²');
 if(/\b(nao|falta|faltam|pendente)\b/.test(text))return null;
 if(unit==='serviço'&&/\b(concluido|concluimos|finalizado|finalizamos|terminado|terminamos|pronto)\b/.test(text))return remaining<=1?remaining:null;
 if(/%|\b(horas?|dias?|reais|cm|km|centimetros?)\b/.test(text))return null;
 const values=text.match(/-?\d+(?:[.,]\d+)?/g)||[];
 if(values.length!==1)return null;
 if(unit==='m'&&/m²|metros? quadrados?/.test(text))return null;
 if(unit==='m²'&&/metros? lineares?/.test(text))return null;
 const value=parseCurrency(values[0]);return value>0?value:null;
}
(function(){
 let mode='financeiro',work=null;const financialDashboard=dashboard;
 const colors=['#3273c8','#238d68','#c51f1f','#ce8a12','#7663bf','#238d88'];
 function entries(){db.andamentoServicos??=[];return db.andamentoServicos}
 function names(){return [...new Set(db.obras.map(o=>o['Cliente/Obra']).filter(Boolean))]}
 function amount(s){return (s.logs||[]).reduce((sum,l)=>sum+num(l.quantity),0)}
 function fmt(n){return num(n).toLocaleString('pt-BR',{maximumFractionDigits:2})}
 function avg(rows){return rows.length?rows.reduce((sum,s)=>sum+progressRatio(s),0)/rows.length:0}
 function switcher(){return '<div class="progress-tools"><button class="btn '+(mode==='financeiro'?'':'alt')+'" data-progress-mode="financeiro">Gráficos financeiros</button><button class="btn '+(mode==='servicos'?'':'alt')+'" data-progress-mode="servicos">Serviços executados</button></div>'}
 function progressBar(value,color,label){return '<div class="jso-chart-track" role="progressbar" aria-label="'+esc(label)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+value.toFixed(1)+'"><span class="jso-chart-bar" style="left:0;width:'+value+'%;background:'+color+'"></span></div>'}
 function render(){
  const all=entries(),works=names();if(work!==null&&!works.includes(work))work=null;const rows=all.filter(s=>work===null||s.work===work);
  function tile(name){const items=all.filter(s=>name===null||s.work===name),percent=avg(items);return '<button class="card card-link" data-progress-work="'+(name===null?'':esc(name))+'" aria-pressed="'+(name===work)+'" style="border:2px solid '+(name===work?'#c51f1f':'#e3e6eb')+';text-align:left"><small>'+esc(name===null?'Total dos serviços':name)+'</small><strong>'+(items.length?fmt(percent)+'%':'Sem serviços')+'</strong><span>'+items.length+' serviços</span></button>'}
  document.querySelector('#view').innerHTML='<div class="title"><h1>Painel Gráficos</h1></div>'+switcher()+'<div class="cards">'+tile(null)+works.map(tile).join('')+'</div><div class="progress-tools"><button class="btn yellow" data-progress-action="new">+ Cadastrar serviço contratado</button><button class="btn alt" data-progress-action="import">Usar serviços do orçamento</button></div><section class="panel"><h2>'+esc(work===null?'Andamento geral dos serviços':'Serviços da obra: '+work)+'</h2>'+(rows.length?'<div class="jso-chart-label"><b>Conclusão geral</b><b>'+fmt(avg(rows))+'%</b></div>'+progressBar(avg(rows),'#238d68','Conclusão geral')+'<p class="jso-chart-note">Média das porcentagens dos serviços; cada serviço tem o mesmo peso.</p>'+rows.map((s,i)=>'<article class="progress-row"><div class="jso-chart-label"><b>'+esc(s.name)+'</b><b>'+fmt(progressRatio(s))+'%</b></div><p>'+esc(s.work)+' · '+fmt(amount(s))+' de '+fmt(s.total)+' '+esc(s.unit)+'</p>'+progressBar(progressRatio(s),colors[i%colors.length],s.name)+'<div class="actions"><button class="btn" data-progress-action="daily" data-service-id="'+s.id+'">Anotar o que foi feito</button><button class="btn alt" data-progress-action="edit" data-service-id="'+s.id+'">Editar serviço</button></div><details class="progress-history"><summary>Anotações diárias ('+(s.logs||[]).length+')</summary><ul>'+(s.logs||[]).map(l=>'<li><b>'+esc(l.date)+'</b> — '+esc(l.note)+'<br>'+fmt(l.quantity)+' '+esc(s.unit)+' <button class="btn alt" data-progress-action="daily-edit" data-service-id="'+s.id+'" data-log-id="'+l.id+'">Corrigir</button></li>').join('')+'</ul></details></article>').join(''):'<p>Cadastre os serviços da obra e a quantidade contratada. Depois anote diariamente o que foi executado.</p>')+'</section>';
 }
 dashboard=function(k){if(k!=='graficos')return financialDashboard(k);if(mode==='servicos')render();else {financialDashboard(k);document.querySelector('#view .title').insertAdjacentHTML('afterend',switcher())}};
 function find(id){return entries().find(s=>s.id===id)}
 function serviceForm(id){const s=find(id),works=names();if(!works.length){alert('Cadastre a obra na aba Obras primeiro.');return}modal('<h2>'+(s?'Editar serviço':'Serviço contratado')+'</h2><div class="formgrid"><label>Obra<select id="ps-work">'+works.map(w=>'<option '+(w===(s?.work||work)?'selected':'')+'>'+esc(w)+'</option>').join('')+'</select></label><label>Serviço<input id="ps-name" value="'+esc(s?.name||'')+'" placeholder="Ex.: levantar muro"></label><label>Medir por<select id="ps-unit">'+['m','m²','unidade','serviço'].map(u=>'<option '+(u===(s?.unit||'m')?'selected':'')+'>'+u+'</option>').join('')+'</select></label><label>Quantidade total contratada<input id="ps-total" inputmode="decimal" value="'+esc(s?.total||'')+'" placeholder="Ex.: 72 metros ou 1 serviço"></label></div><div class="actions"><button class="btn" id="ps-save">Salvar serviço</button><button class="btn alt" data-action="close">Cancelar</button></div>');document.querySelector('#ps-save').onclick=()=>{const name=document.querySelector('#ps-name').value.trim(),total=parseCurrency(document.querySelector('#ps-total').value),unit=document.querySelector('#ps-unit').value,selectedWork=document.querySelector('#ps-work').value;if(!name||total<=0){alert('Informe o serviço e a quantidade contratada maior que zero.');return}if(s&&total<amount(s)){alert('O total contratado não pode ser menor que a quantidade já executada.');return}if(s)Object.assign(s,{name,total,unit,work:selectedWork});else entries().push({id:crypto.randomUUID(),name,total,unit,work:selectedWork,logs:[]});save();closeM();render()}}
 function dailyForm(id,logId){const s=find(id);if(!s)return;const previous=(s.logs||[]).find(l=>l.id===logId),done=amount(s)-(previous?num(previous.quantity):0),remaining=s.total-done;
 modal('<h2>Anotar serviço executado</h2><p><b>'+esc(s.name)+'</b> · '+esc(s.work)+'<br>Contratado: '+fmt(s.total)+' '+esc(s.unit)+' · Executado: '+fmt(done)+' '+esc(s.unit)+'</p><div class="formgrid"><label>Data<input id="pd-date" type="date" value="'+esc(previous?.date||today())+'"></label><label class="full">O que foi feito hoje?<textarea id="pd-note" rows="3" placeholder="Ex.: fizemos 12 metros do muro; ou serviço concluído">'+esc(previous?.note||'')+'</textarea></label><label>Quantidade feita hoje (se faltar na anotação)<input id="pd-qty" inputmode="decimal" value="'+esc(previous?.quantity??'')+'" placeholder="'+esc(s.unit==='serviço'?'1 para um serviço concluído':s.unit)+'"></label></div><p class="progress-preview" id="pd-preview" role="status"></p><div class="actions"><button class="btn" id="pd-save">Salvar anotação</button><button class="btn alt" data-action="close">Cancelar</button></div>');
 function quantity(){const explicit=document.querySelector('#pd-qty').value.trim();return explicit?parseCurrency(explicit):progressQuantity(document.querySelector('#pd-note').value,s.unit,remaining)}
 function preview(){const q=quantity();document.querySelector('#pd-preview').textContent=q&&q>0&&q<=remaining?'Será registrado: '+fmt(q)+' '+s.unit+'. Andamento: '+fmt((done+q)/s.total*100)+'%.':remaining<=0?'Este serviço já está 100% concluído.':q>remaining?'A quantidade ultrapassa o restante de '+fmt(remaining)+' '+s.unit+'.':'Escreva a quantidade executada na anotação ou preencha o campo acima. Para um serviço completo, escreva “serviço concluído”.'}
 document.querySelector('#pd-note').oninput=preview;document.querySelector('#pd-qty').oninput=preview;preview();document.querySelector('#pd-save').onclick=()=>{const note=document.querySelector('#pd-note').value.trim(),date=document.querySelector('#pd-date').value,q=quantity();if(!note||!date||!q||q<=0||q>remaining){alert('Informe a data, o que foi feito e uma quantidade válida. Confira a prévia antes de salvar.');return}const log={id:previous?.id||crypto.randomUUID(),note,date,quantity:q};s.logs??=[];if(previous)s.logs[s.logs.indexOf(previous)]=log;else s.logs.push(log);save();closeM();render()}
 }
 function importForm(){const works=names(),quotes=db.orcamentos.filter(q=>works.includes(q.cliente)&&Array.isArray(q.items));if(!quotes.length){alert('Nenhum orçamento corresponde às obras cadastradas. Você pode cadastrar os serviços manualmente.');return}modal('<h2>Serviços do orçamento</h2><label>Escolha o orçamento<select id="pi-quote">'+quotes.map((q,i)=>'<option value="'+i+'">'+esc(q.cliente)+' · '+esc(q.data)+' · '+money(q.total)+'</option>').join('')+'</select></label><p>As descrições, unidades e quantidades do orçamento serão usadas como serviços contratados.</p><div class="actions"><button class="btn" id="pi-save">Adicionar serviços</button><button class="btn alt" data-action="close">Cancelar</button></div>');document.querySelector('#pi-save').onclick=()=>{const q=quotes[Number(document.querySelector('#pi-quote').value)];let added=0;for(const item of q.items){const name=String(item.descricao||'').trim(),total=num(item.qtd),raw=String(item.unidade||'').toLowerCase(),unit=/m²|m2/.test(raw)?'m²':/^(m|metro|metros|ml)$/.test(raw)?'m':/servi/.test(raw)?'serviço':'unidade';if(!name||total<=0||entries().some(s=>s.work===q.cliente&&s.name===name))continue;entries().push({id:crypto.randomUUID(),work:q.cliente,name,total,unit,logs:[]});added++}save();work=q.cliente;closeM();render();alert(added+' serviços adicionados. Confira a quantidade total contratada de cada serviço.')}}
 document.addEventListener('click',event=>{const b=event.target.closest('[data-progress-mode],[data-progress-work],[data-progress-action]');if(!b)return;if(b.dataset.progressMode){mode=b.dataset.progressMode;dashboard('graficos');return}if('progressWork' in b.dataset){work=b.dataset.progressWork||null;render();return}const action=b.dataset.progressAction;if(action==='new')serviceForm();if(action==='edit')serviceForm(b.dataset.serviceId);if(action==='daily'||action==='daily-edit')dailyForm(b.dataset.serviceId,b.dataset.logId);if(action==='import')importForm()});
})();
</script>

<script>
/* Gustavo e Soraia: confirmação dos serviços em 06/10/2026. */
const jsoGustavoScope = {
 key:'gustavo-soraia-acompanhamento-20261006',
 internos:[
 ['Retirada de revestimentos da parte interna do muro',600,true],
 ['Regularização da parte interna do muro com argamassa AC3',750,true],
 ['Selar muro e fazer textura',2300,false],

 ['Preparar formas e ferragens e concretar laje (betoneira por conta do cliente)',4200,true],
 ['Abrir vão para instalação de porta',650,false],
 ['Fazer contrapiso na laje',1300,true],
 ['Acréscimo do muro do vizinho (substitui paredes laterais da laje)',1100,false],
 ['Assentamento cerâmico ou porcelanato na área construída, com rejunte',2100,false],

 ],
 fachada:[

 ['Execução de alvenaria, chapisco, emboço e reboco',true],

 ['Execução inspirada no imóvel vizinho, com detalhes definidos pelo cliente',false]
 ]
};
function jsoServiceSummary(obra){
 const rows=(db.andamentoServicos||[]).filter(s=>s.work===obra?.['Cliente/Obra']);
 if(!rows.length)return null;
 const ratio=s=>progressRatio(s);
 const done=rows.filter(s=>ratio(s)>=100),pending=rows.filter(s=>ratio(s)<100);
 return {rows,done,pending,percent:Math.round(rows.reduce((n,s)=>n+ratio(s),0)/rows.length*10)/10};
}
function jsoTrackingHTML(obra){
 const s=jsoServiceSummary(obra);if(!s)return '';
 const list=rows=>'<ul>'+rows.map(r=>'<li>'+esc(r.group?r.group+' — ':'')+esc(r.name)+' ('+progressRatio(r).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%)</li>').join('')+'</ul>';
 return '<section class="panel" id="jso-service-followup"><h2>Acompanhamento dos serviços</h2><p><b>'+s.percent.toLocaleString('pt-BR')+'% executado</b> · '+s.done.length+' de '+s.rows.length+' serviços concluídos</p><div class="jso-chart-track" role="progressbar" aria-label="Andamento dos serviços" aria-valuenow="'+s.percent+'" aria-valuemin="0" aria-valuemax="100"><span class="jso-chart-bar" style="left:0;width:'+s.percent+'%;background:#238d68"></span></div><p class="muted">Média dos serviços, com o mesmo peso para cada um. Atualize as quantidades em Painel Gráficos → Serviços executados.</p><h3>Serviços concluídos</h3>'+list(s.done)+'<h3>Serviços pendentes ou em andamento</h3>'+list(s.pending)+'</section>';
}
function jsoImportGustavo(){
 const scope=jsoGustavoScope;
 if((db.importacoesAcompanhamento||[]).includes(scope.key))return false;
 const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
 const exact=db.obras.filter(o=>norm(o['Cliente/Obra'])==='gustavo');
 const candidates=exact.length?exact:db.obras.filter(o=>/^gustavo\b/.test(norm(o['Cliente/Obra'])));
 if(candidates.length!==1)return false;
 const obra=candidates[0],work=obra['Cliente/Obra'];
 const snapshot=JSON.stringify(db);
 try{
  db.orcamentos??=[];db.andamentoServicos??=[];db.importacoesAcompanhamento??=[];
  const makeQuote=(suffix,items,extra)=>({
   id:scope.key+'-'+suffix,importId:scope.key+'-'+suffix,clienteId:obra.clienteId,
   cliente:work,endereco:obra['Endereço do cliente']||'',celular:obra['Celular do cliente']||'',
   data:suffix==='internos'?'2026-08-18':'2026-10-06',prazo:suffix==='fachada'?'Até 3 semanas':'A combinar',
   pagamento:suffix==='fachada'?'30% na assinatura; 40% durante a execução; 30% na conclusão.':'Transferência bancária, dinheiro ou Pix.',
   obs:extra+'\nClientes: Gustavo e Soraia. Recebimentos mantidos conforme os registros do aplicativo. Orçamento para acompanhamento; não altera automaticamente o valor inicial da obra.',
   items,total:items.reduce((n,i)=>n+i.valor,0),status:'Acompanhamento'
  });
  const q1=makeQuote('internos',scope.internos.map(([descricao,valor])=>({descricao,valor,qtd:1,unidade:'serviço'})),
   'Proposta 042-2026. Contrapiso concluído. Paredes laterais substituídas pelo acréscimo do muro do vizinho por R$ 1.100,00, pendente. Betoneira por conta do cliente.');
  const q2=makeQuote('fachada',[{descricao:'Reforma de fachada: '+scope.fachada.map(r=>r[0]).join('; '),qtd:1,unidade:'serviço',valor:9000}],
   'Valor global impresso: R$ 9.000,00, somente mão de obra. Materiais fornecidos pelo cliente. Extras mediante aprovação prévia. Data original não informada; cadastrado em 06/10/2026. Anotações manuscritas de valores não foram usadas para alterar pagamentos.');
  for(const quote of [q1,q2])if(!db.orcamentos.some(q=>q.id===quote.id||q.importId===quote.importId))db.orcamentos.push(quote);
  const add=(name,done,group,index,quoteId,value)=>{
   const id=scope.key+'-'+group+'-'+index;
   if(db.andamentoServicos.some(s=>s.id===id))return;
   db.andamentoServicos.push({id,work,name,total:1,unit:'serviço',group:group==='internos'?'Reforma interna':'Fachada',quoteId,contractValue:value,
    logs:done?[{id:id+'-confirmacao',date:'2026-10-06',quantity:1,note:'Serviço confirmado como já concluído pelo responsável em 06/10/2026; data de execução não informada.'}]:[]});
  };
  scope.internos.forEach(([name,value,done],i)=>add(name,done,'internos',i,q1.id,value));
  scope.fachada.forEach(([name,done],i)=>add(name,done,'fachada',i,q2.id,null));
  db.importacoesAcompanhamento.push(scope.key);save();return true;
 }catch(error){db=JSON.parse(snapshot);console.error('Não foi possível salvar o acompanhamento de Gustavo.',error);return false}
}

 show=function(k){jsoImportGustavo();return originalShow(k)};

 };
 jsoImportGustavo();
 window.addEventListener('pageshow',()=>{jsoImportGustavo()});
})();
