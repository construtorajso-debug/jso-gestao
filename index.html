<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c51f1f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="JSO Gestão"><meta name="description" content="Gestão de obras e orçamentos da Construtora JSO"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="stylesheet" href="style.css?v=36"><title>JSO Gestão</title></head><body>
<header><div class="brand"><b>JSO</b><span>CONSTRUÇÕES E REFORMAS</span><small>A Construtora do Povo</small></div><button id="menuBtn">☰</button></header>
<div class="layout"><nav id="nav"></nav><main><div id="view"></div></main></div>
<script src="pdf-lib.min.js"></script><script src="quote_catalog.js"></script><script src="clients.js"></script><script src="app.js?v=34"></script><script src="diary.js"></script><script src="report.js"></script><script src="materials.js?v=27"></script>
<style>
.jso-chart{display:grid;gap:20px;margin:24px 0}.jso-chart-label{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:7px;font-size:16px}.jso-chart-track{height:26px;background:#eef1f5;border-radius:5px;position:relative;overflow:hidden}.jso-chart-bar{position:absolute;height:100%;border-radius:4px}.jso-chart-zero{position:absolute;height:100%;border-left:1px solid #697888}.jso-chart-axis{display:flex;justify-content:space-between;font-size:14px;color:#555}.jso-chart-note{font-size:14px;color:#555}
</style>
<script>
(function(){
 const oldDashboard=dashboard;let chartWork=null;
 function chart(c,title){
  const values=[['Contrato e extras aprovados',c.contratos,'#3273c8'],['Recebido do cliente',c.rec,'#238d68'],['Gastos da obra',c.gastos,'#c51f1f'],['Saldo a receber',c.saldo,'#ce8a12']];
  const lo=Math.min(0,...values.map(v=>v[1])),hi=Math.max(0,...values.map(v=>v[1])),range=hi-lo||1,zero=-lo/range*100;
  return '<div class="jso-chart" role="img" aria-label="'+esc(title+': '+values.map(v=>v[0]+' '+money(v[1])).join('; '))+'">'+values.map(v=>'<div><div class="jso-chart-label"><b>'+v[0]+'</b><span>'+money(v[1])+'</span></div><div class="jso-chart-track"><span class="jso-chart-zero" style="left:'+zero+'%"></span><span class="jso-chart-bar" style="left:'+((Math.min(0,v[1])-lo)/range*100)+'%;width:'+(Math.abs(v[1])/range*100)+'%;background:'+v[2]+'"></span></div></div>').join('')+'<div class="jso-chart-axis"><span>'+money(lo)+'</span><span>'+money(hi)+'</span></div></div>';
 }
 dashboard=function(k){
  if(k!=='graficos')return oldDashboard(k);

  const works=[...new Set(db.obras.map(o=>o['Cliente/Obra']).filter(Boolean))];if(chartWork!==null&&!works.includes(chartWork))chartWork=null;
  const selected=chartWork===null?calc():calc(chartWork);
  function balloon(name,total,active){return '<button type="button" class="card card-link" data-chart-work="'+(name===null?'total':esc(name))+'" aria-pressed="'+active+'" style="border:2px solid '+(active?'#c51f1f':'#e3e6eb')+';text-align:left"><small>'+esc(name===null?'Total de todas as obras':name)+'</small><strong>'+money(total)+'</strong><span style="font-size:14px">Ver gráfico</span></button>'}
  document.querySelector('#view').innerHTML='<div class="title"><h1>Painel Gráficos</h1></div><div class="cards">'+balloon(null,calc().contratos,chartWork===null)+works.map(name=>balloon(name,calc(name).contratos,chartWork===name)).join('')+'</div><section class="panel" style="margin-top:20px"><h2>'+esc(chartWork===null?'Gráfico geral — todas as obras':'Gráfico da obra: '+chartWork)+'</h2>'+chart(selected,chartWork===null?'Gráfico geral':'Gráfico de '+chartWork)+'<p class="jso-chart-note">Os balões mostram o valor do contrato com extras aprovados. As barras mostram contrato, recebido, gastos e saldo a receber.</p></section>';
 };
 document.addEventListener('click',event=>{const button=event.target.closest('[data-chart-work]');if(button){chartWork=button.dataset.chartWork==='total'?null:button.dataset.chartWork;dashboard('graficos')}});

})();
</script>
</body></html>
